

services:
  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: python-etl
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: etl_user
      DB_PASSWORD: etl_password
      DB_NAME: etl_database

  db:
    image: mysql:8.4
    container_name: etl-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: etl_database
      MYSQL_USER: etl_user
      MYSQL_PASSWORD: etl_password
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
